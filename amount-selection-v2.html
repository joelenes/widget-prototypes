<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amount Selection — Uphold Widget Prototype</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-bg: #F2F5FC;
    --color-surface: #FFFFFF;
    --color-surface-raised: #E8EDF8;
    --color-card-bg: #EEF2FA;
    --background-level-1: #FFFFFF;
    --color-line: #C8D0E6;
    --color-text-primary: #0D1220;
    --color-text-secondary: #344070;
    --color-text-muted: #6B7A9E;
    --color-green: #1A9C17;
    --color-green-light: #14821E;
    --color-error: #C93318;
    --color-warning: #B87A00;
    --color-success: #14821E;
    --pill-green-bg: #E4F7E3;
    --pill-blue-bg: #E3EEF7;
    --pill-coral-bg: #F7E3E3;
    --pill-gold-bg: #F7F0E3;
    --ic-amber-bg: #FFF3DC; --ic-amber-txt: #8C5A00;
    --ic-purple-bg: #EDE8FF; --ic-purple-txt: #5B2EBF;
    --ic-teal-bg: #E0F7EE;  --ic-teal-txt: #0A6E42;
    --ic-gray-bg: #E8EDF8;  --ic-gray-txt: #6B7A9E;
    --ic-coral-bg: #FFE8E3; --ic-coral-txt: #B02E18;
  }

  html, body { background: var(--color-bg); color: var(--color-text-primary); font-family: 'Proxima Nova', 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

  #root { min-height: 100vh; }

  /* Reviewer shell */
  .reviewer-shell {
    min-height: 100vh;
    background: #DDE3F0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 48px;
  }

  .reviewer-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--color-text-muted);
    margin-bottom: 20px;
    opacity: 0.6;
  }

  /* ── Grouped dropdown ── */
  .dropdown-wrap {
    position: relative;
    width: 100%;
    margin-bottom: 0;
  }

  .dropdown-trigger {
    width: 100%;
    height: 48px;
    background: var(--color-surface);
    border: 0.5px solid var(--color-line);
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .dropdown-trigger:hover { border-color: var(--color-text-muted); }
  .dropdown-trigger.open { border-color: var(--color-green); }

  .dropdown-trigger-label {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-primary);
    text-align: left;
  }

  .dropdown-trigger-group {
    font-size: 11px;
    font-weight: 400;
    color: var(--color-text-muted);
    margin-right: 10px;
  }

  .dropdown-chevron {
    font-size: 11px;
    color: var(--color-text-muted);
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .dropdown-trigger.open .dropdown-chevron { transform: rotate(180deg); }

  .dropdown-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--color-surface);
    border: 0.5px solid var(--color-line);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    z-index: 100;
    overflow: hidden;
    animation: dropIn 0.12s ease;
  }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dropdown-group-header {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--color-green);
    padding: 12px 16px 4px;
  }

  .dropdown-group-divider {
    height: 0.5px;
    background: var(--color-line);
  }

  .dropdown-option {
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 16px 0 32px;
    cursor: pointer;
    font-size: 14px;
    color: var(--color-text-secondary);
    transition: background 0.1s;
    gap: 8px;
    border: none;
    background: none;
    width: 100%;
    font-family: inherit;
    text-align: left;
  }
  .dropdown-option:hover { background: var(--color-surface-raised); }
  .dropdown-option:focus { outline: 2px solid var(--color-green); outline-offset: -2px; }
  .dropdown-option.active {
    font-weight: 600;
    color: var(--color-text-primary);
  }

  .dropdown-active-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-green);
    flex-shrink: 0;
    margin-left: -14px; /* pull back to align at 16px from left */
    margin-right: 8px;
  }

  /* ── Prototype annotation ── */
  .proto-annotation {
    width: 440px;
    background: #FFF8EC;
    border: 0.5px solid #FAC461;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 20px;
  }

  .proto-annotation-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #8C5A00;
    margin-bottom: 6px;
  }

  .proto-annotation-body {
    font-size: 12px;
    color: #344070;
    line-height: 1.5;
  }

  /* Screen stage */
  .screen-stage {
    position: relative;
    display: flex;
    justify-content: center;
  }

  .screen-fade {
    transition: opacity 0.15s ease;
  }

  /* Widget frame */
  .widget-frame {
    width: 393px;
    height: 784px;
    background: var(--color-bg);
    border-radius: 40px;
    border: 0.5px solid var(--color-line);
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    overflow: hidden;
    position: relative;
  }

  /* Status bar */
  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 20px;
    gap: 6px;
  }
  .status-time {
    font-size: 15px;
    font-weight: 600;
    color: var(--color-text-primary);
    margin-right: auto;
    margin-left: 4px;
  }
  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
    color: var(--color-text-primary);
    font-size: 12px;
  }

  /* Nav bar */
  .nav-bar {
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: relative;
  }
  .nav-close {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--color-surface);
    border: 0.5px solid var(--color-line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--color-text-muted);
    font-size: 14px;
    flex-shrink: 0;
  }
  .nav-title {
    flex: 1;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--color-text-primary);
  }
  .nav-spacer { width: 28px; flex-shrink: 0; }

  /* Divider */
  .divider {
    height: 0.5px;
    background: var(--color-line);
    width: 100%;
  }

  /* Zone label */
  .zone-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--color-text-muted);
    padding: 12px 16px 4px;
  }

  /* Node row */
  .node-row {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    position: relative;
    transition: background 0.1s;
  }
  .node-row:active { background: rgba(255,255,255,0.03); }

  .node-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    flex-shrink: 0;
    margin-right: 12px;
  }

  .node-info { flex: 1; min-width: 0; }
  .node-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node-sub {
    font-size: 11px;
    color: var(--color-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .node-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    margin-right: 8px;
  }
  .node-right-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
  }
  .node-right-sub {
    font-size: 11px;
    color: var(--color-text-muted);
  }

  .node-chevron {
    color: var(--color-text-muted);
    font-size: 12px;
    flex-shrink: 0;
  }

  /* Connector */
  .connector-section {
    position: relative;
    height: 0;
    z-index: 3;
  }

  .connector-btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 0.5px solid var(--color-line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--color-text-muted);
    cursor: default;
    background: var(--color-surface-raised);
    flex-shrink: 0;
  }
  .connector-btn.swappable {
    cursor: pointer;
    background: var(--color-surface);
    transition: background 0.15s;
  }
  .connector-btn.swappable:active {
    background: var(--color-surface-raised);
  }
  .connector-btn.flipping {
    animation: connFlip 0.18s ease forwards;
  }

  @keyframes connFlip {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(180deg); }
  }

  /* Amount zone */
  .amount-zone {
    padding: 20px 16px 12px;
    cursor: pointer;
    background: transparent;
    border-top: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .amount-zone.active .amount-display-number { color: var(--color-text-primary); }
  .amount-zone.active .amount-display-currency { color: var(--color-text-primary); }

  .amount-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .amount-number {
    font-size: 48px;
    font-weight: 600;
    color: var(--color-text-primary);
    transition: font-size 0.15s ease, color 0.12s ease;
    letter-spacing: -1px;
    line-height: 1;
  }
  .amount-number.focused {
    font-size: 56px;
  }
  .amount-number.is-zero {
    color: var(--color-text-muted);
  }
  .amount-number.active-color {
    color: var(--color-text-primary);
  }
  .amount-number.focused.active-color {
    color: var(--color-text-primary);
  }
  .amount-number.error { color: var(--color-error) !important; }

  /* flip animation */
  .amount-number.flip-out {
    animation: flipOut 80ms ease forwards;
  }
  .amount-number.flip-in {
    animation: flipIn 80ms ease forwards;
  }
  @keyframes flipOut {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-4px); }
  }
  @keyframes flipIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .amount-unit {
    font-size: 18px;
    color: var(--color-text-muted);
    font-weight: 400;
    line-height: 1;
  }

  .amount-controls {
    display: flex;
    gap: 6px;
    align-items: center;
    padding-bottom: 4px; /* baseline-align with text */
  }

  .max-pill {
    width: 36px;
    height: 22px;
    border-radius: 4px;
    border: 0.5px solid var(--color-line);
    background: var(--color-surface-raised);
    font-size: 10px;
    color: var(--color-text-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s, opacity 0.15s;
  }
  .max-pill:active { background: var(--color-line); }
  .max-pill.dimmed { opacity: 0.5; }

  .amount-equiv-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 0; /* handled by amount-row margin-bottom */
  }

  .amount-equiv {
    font-size: 14px;
    color: var(--color-text-muted);
    flex-grow: 0 !important;
  }

  .flip-pill {
    height: 18px;
    padding: 0 6px;
    border-radius: 3px;
    border: 0.5px solid var(--color-line);
    background: var(--color-surface-raised);
    font-size: 10px;
    color: var(--color-text-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    cursor: pointer;
    font-family: inherit;
    gap: 3px;
    transition: background 0.1s, opacity 0.15s;
    flex-shrink: 0;
  }
  .flip-pill:active { background: var(--color-line); }
  .flip-pill.dimmed { opacity: 0.5; }

  .amount-error {
    font-size: 12px;
    color: var(--color-error);
    margin-top: 8px;
    text-align: center;
  }

  /* Fee zone */
  .fee-zone {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-left 0.2s;
  }
  .fee-zone.stale {
    border-left: 3px solid var(--color-warning);
    padding-left: 13px;
  }

  .fee-left { display: flex; flex-direction: column; gap: 2px; }
  .fee-label { font-size: 11px; color: var(--color-text-muted); }
  .fee-value { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }

  .fee-right {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--color-text-muted);
    text-align: right;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-green);
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .fee-shimmer {
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--color-surface) 25%, var(--color-surface-raised) 50%, var(--color-surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    width: 80px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Receive summary */
  .receive-zone {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .receive-label { font-size: 12px; color: var(--color-text-muted); padding-top: 2px; }
  .receive-right { text-align: right; }
  .receive-value { font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
  .receive-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }

  /* ── Tap-outside overlay ──
     Covers the content area above the keypad panel.
     Tapping it dismisses the keypad.
  */
  .keypad-backdrop {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
  }
  .keypad-backdrop.open { display: block; }

  /* ── Floating keypad + CTA panel ──
     Anchored to the bottom of the 784px frame. The panel grows
     upward as the keypad reveals, overlaying fee/receive content.
     CTA is always at the bottom; keypad slides in above it.
  */
  .keypad-cta-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--color-surface);
    border-top: 0.5px solid var(--color-line);
    z-index: 5;
  }

  /* Dismiss handle — "Done" bar at the top of the keypad panel */
  .keypad-dismiss-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 8px 16px 0;
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.22s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s;
    opacity: 0;
  }
  .keypad-dismiss-bar.open {
    max-height: 36px;
    opacity: 1;
  }

  .keypad-done-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-green);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0 4px 16px;
    line-height: 1;
  }
  .keypad-done-btn:active { opacity: 0.6; }

  /* Keypad portion — max-height collapses it when closed */
  .keypad-slide {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.22s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .keypad-slide.open {
    max-height: 280px; /* enough for 4 rows + padding */
  }

  /* Keypad grid inside the panel */
  .keypad {
    padding: 8px 12px 4px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .keypad-key {
    height: 52px;
    background: var(--color-bg);
    border: 0.5px solid var(--color-line);
    border-radius: 10px;
    font-family: inherit;
    font-size: 20px;
    font-weight: 500;
    color: var(--color-text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, transform 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  .keypad-key:active {
    background: var(--color-surface-raised);
    transform: scale(0.96);
  }
  .keypad-key.backspace { font-size: 16px; color: var(--color-text-muted); }
  .keypad-key.empty { background: transparent; border-color: transparent; cursor: default; }
  .keypad-key.empty:active { background: transparent; transform: none; }

  /* CTA inside the panel */
  .cta-zone {
    padding: 8px 16px 0;
  }

  .cta-btn {
    width: 100%;
    height: 48px;
    border-radius: 9999px;
    background: var(--color-green);
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #FFFFFF;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.1px;
  }
  .cta-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .cta-btn:not(:disabled):active {
    transform: scale(0.97);
  }

  /* Legal text + powered-by below CTA */
  .cta-legal {
    font-size: 13px;
    color: var(--color-text-secondary);
    text-align: center;
    line-height: 1.5;
    padding: 10px 16px 4px;
  }
  .cta-legal a, .cta-legal span.link { color: var(--color-green); font-weight: 600; }

  .powered-by {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px 20px;
  }
  .powered-by-text {
    font-size: 12px;
    color: var(--color-text-muted);
  }
  .powered-by-text strong { font-weight: 600; }

  /* ── Node card group (Figma style) ── */
  .node-card-group {
    padding: 0 16px;
    position: relative;
  }

  .node-card {
    background: var(--background-level-1);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 8px 12px 16px;
    position: relative;
  }
  .node-card.top {
    border-radius: 16px 16px 4px 4px;
    margin-bottom: 4px;
  }
  .node-card.bottom {
    border-radius: 4px 4px 16px 16px;
  }

  .node-card-inner { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

  .node-card-zone {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--color-text-muted);
    line-height: 12px;
  }

  .node-card-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .node-card-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .node-card-text { flex: 1; min-width: 0; }
  .node-card-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node-card-sub {
    font-size: 12px;
    color: var(--color-text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .node-card-sub-dot {
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--color-text-muted);
    flex-shrink: 0;
  }

  .node-card-trailing { display: flex; flex-direction: column; align-items: flex-end; }
  .node-card-val { font-size: 12px; font-weight: 600; color: var(--color-text-primary); }
  .node-card-val-sub { font-size: 12px; color: var(--color-text-muted); }

  .node-card-chevron {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-muted);
    font-size: 13px;
    flex-shrink: 0;
  }

/* ─── HELPERS ─── */
const CURRENCY_SYMBOL = { USD: '$', EUR: '€', GBP: '£' };
const QUICK_AMOUNTS = {
  USD: ['$25', '$50', '$100', '$250'],
  EUR: ['€25', '€50', '€100', '€250'],
  GBP: ['£25', '£50', '£100', '£250'],
  BTC: ['0.001', '0.005', '0.01', '0.05'],
  ETH: ['0.05', '0.1', '0.5', '1.0'],
};
function getCurrencySymbol(unit) { return CURRENCY_SYMBOL[unit] || null; }
function getQuickAmounts(unit) { return QUICK_AMOUNTS[unit] || []; }
function parseQuickAmount(str) { return str.replace(/[$€£]/g, ''); }
function iconColors(color) {
  const map = {
    amber: { bg: T.icAmberBg, txt: T.icAmberTxt },
    purple: { bg: T.icPurpleBg, txt: T.icPurpleTxt },
    teal: { bg: T.icTealBg, txt: T.icTealTxt },
    gray: { bg: T.icGrayBg, txt: T.icGrayTxt },
    coral: { bg: T.icCoralBg, txt: T.icCoralTxt },
  };
  return map[color] || map.gray;
}

function NodeIcon({ icon, iconColor, size = 40 }) {
  const c = iconColors(iconColor);
  return (
    <div className="node-icon" style={{ width: size, height: size, background: c.bg, color: c.txt, fontSize: size < 32 ? 11 : 16 }}>
      {icon}
    </div>
  );
}

/* ─── BOTTOM SHEET ─── */
function SheetItem({ item, selectedId, onSelect, showConversionBadge }) {
  return (
    <div
      className={`sheet-item ${item.id === selectedId ? 'selected' : ''}`}
      onClick={() => onSelect(item)}
    >
      <NodeIcon icon={item.icon} iconColor={item.iconColor} />
      <div className="node-info" style={{ marginLeft: 12 }}>
        <div className="node-name">{item.name}</div>
        <div className="node-sub">{item.sub}</div>
      </div>
      {showConversionBadge && (
        <span style={{fontSize:10, fontWeight:700, background:'#201A0D', color:'#FAC461', padding:'2px 6px', borderRadius:4, marginLeft:'auto', marginRight:8, flexShrink:0}}>
          Conversion
        </span>
      )}
      <div className={`sheet-item-check ${item.id === selectedId ? '' : 'unselected'}`}>
        {item.id === selectedId ? '✓' : ''}
      </div>
    </div>
  );
}

function BottomSheet({ open, onClose, title, items, selectedId, onSelect, grouped }) {
  const [closing, setClosing] = useState(false);

  const handleClose = () => {
    setClosing(true);
    setTimeout(() => { setClosing(false); onClose(); }, 250);
  };

  const handleSelect = (item) => {
    onSelect(item);
    handleClose();
  };

  const fiatItems = grouped ? items.filter(item => (item.assetType || 'fiat') === 'fiat') : items;
  const cryptoItems = grouped ? items.filter(item => item.assetType === 'crypto') : [];

  return (
    <>
      <div className={`sheet-overlay ${open && !closing ? 'open' : ''}`} onClick={handleClose} />
      <div className={`bottom-sheet ${open && !closing ? 'open' : ''} ${closing ? 'closing' : ''}`}>
        <div className="sheet-handle" />
        <div className="sheet-title">{title}</div>
        <div className="sheet-list">
          {grouped ? (
            <>
              {fiatItems.length > 0 && <>
                <div style={{fontSize:10, fontWeight:700, letterSpacing:'1.5px', textTransform:'uppercase', color:T.green, padding:'8px 16px 4px'}}>Fiat accounts</div>
                {fiatItems.map(item => <SheetItem key={item.id} item={item} selectedId={selectedId} onSelect={handleSelect} showConversionBadge={false} />)}
              </>}
              {cryptoItems.length > 0 && <>
                <div style={{fontSize:10, fontWeight:700, letterSpacing:'1.5px', textTransform:'uppercase', color:T.green, padding:'8px 16px 4px'}}>Crypto accounts</div>
                {cryptoItems.map(item => <SheetItem key={item.id} item={item} selectedId={selectedId} onSelect={handleSelect} showConversionBadge={true} />)}
              </>}
            </>
          ) : (
            items.map(item => <SheetItem key={item.id} item={item} selectedId={selectedId} onSelect={handleSelect} showConversionBadge={false} />)
          )}
        </div>
      </div>
    </>
  );
}

  const flatOptions = useCases; // already in group order

  // Close on outside click
  useEffect(() => {
    const handler = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const handleSelect = (uc) => {
    setOpen(false);
    onChange(uc.id);
  };

  const handleKeyDown = (e) => {
    if (!open) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); }
      return;
    }
    const ids = flatOptions.map(uc => uc.id);
    const cur = ids.indexOf(activeId);
    if (e.key === 'Escape' || e.key === 'Tab') { setOpen(false); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); const next = ids[(cur + 1) % ids.length]; onChange(next); optionRefs.current[next]?.focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); const prev = ids[(cur - 1 + ids.length) % ids.length]; onChange(prev); optionRefs.current[prev]?.focus(); }
    else if (e.key === 'Enter') { setOpen(false); }
  };

  return (
    <div className="dropdown-wrap" ref={wrapRef} onKeyDown={handleKeyDown}>
      <button
        className={`dropdown-trigger ${open ? 'open' : ''}`}
        onClick={() => setOpen(o => !o)}
        aria-haspopup="listbox"
        aria-expanded={open}
      >
        <span className="dropdown-trigger-group">{activeUC.group}</span>
        <span className="dropdown-trigger-label">{activeUC.label}</span>
        <span className="dropdown-chevron">▾</span>
      </button>

      {open && (
        <div className="dropdown-panel" role="listbox">
          {GROUPS.map((grp, gi) => {
            const items = useCases.filter(uc => uc.group === grp);
            if (!items.length) return null;
            return (
              <div key={grp}>
                {gi > 0 && <div className="dropdown-group-divider" />}
                <div className="dropdown-group-header">{grp}</div>
                {items.map(uc => (
                  <button
                    key={uc.id}
                    ref={el => optionRefs.current[uc.id] = el}
                    className={`dropdown-option ${uc.id === activeId ? 'active' : ''}`}
                    role="option"
                    aria-selected={uc.id === activeId}
                    onClick={() => handleSelect(uc)}
                  >
                    {uc.id === activeId && <span className="dropdown-active-dot" />}
                    {uc.label}
                  </button>
                ))}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PrototypeAnnotation({ text }) {

      <div className="proto-annotation-body">{text}</div>

/* ─── A2A HELPERS ─── */
function getSimulatedRate(originId, destId) {
  const rates = {
    'btc-main': 0.000018,
    'eth-main': 0.00031,
    'sol-main': 0.0063,
  };
  return rates[destId] || 0.000018;
}

function getFallbackRate(destId) {
  return getSimulatedRate(null, destId);
}

function getAssetUnit(node) {
  if (!node) return 'USD';
  if (node.id === 'btc-main' || node.id === 'btc-ext' || node.id === 'btc-ext2') return 'BTC';
  if (node.id === 'eth-main') return 'ETH';
  if (node.id === 'sol-main') return 'SOL';
  if (node.id === 'gbp-main' || (node.sub && node.sub.includes('GBP'))) return 'GBP';
  if (node.id === 'eur-main' || (node.sub && node.sub.includes('EUR'))) return 'EUR';
  return 'USD';
}

function deriveCTALabel(config, destination, isConversion) {
  if (!isConversion) return config.ctaLabel;
  const destAsset = getAssetUnit(destination);
  if (config.id === 'deposit-card') return `Buy ${destAsset}`;
  if (config.id.includes('withdrawal')) return `Convert to ${destAsset}`;
  if (config.id === 'send') return `Send ${destAsset}`;
  return `Buy ${destAsset}`;
}

/* ─── useTransactionState HOOK ─── */
function useTransactionState(config, initialOrigin, initialDest) {
  const [destination, setDestinationNode] = useState(initialDest);
  const [origin, setOriginNode] = useState(initialOrigin);
  const [rawAmount, setRawAmount] = useState(config.defaultAmount);
  const [flipped, setFlipped] = useState(false);
  const [flipPhase, setFlipPhase] = useState(null);

  const originAssetType = origin.assetType || 'fiat';
  const destAssetType = destination.assetType || 'fiat';
  const isConversion = originAssetType !== destAssetType;

  const [rate, setRate] = useState(null);
  const [rateAge, setRateAge] = useState(0);
  const [rateLoading, setRateLoading] = useState(false);
  const [rateStale, setRateStale] = useState(false);

  const [calloutDismissed, setCalloutDismissed] = useState(false);

  const prevDestRef = React.useRef(destination.id);
  useEffect(() => {
    const destChanged = prevDestRef.current !== destination.id;
    prevDestRef.current = destination.id;

    if (!isConversion) {
      setRate(null);
      setRateAge(0);
      setRateStale(false);
      setRateLoading(false);
      return;
    }

    setRateLoading(true);
    setRate(null);
    setRateAge(0);
    setRateStale(false);

    const timeout = setTimeout(() => {
      setRate(getSimulatedRate(origin.id, destination.id));
      setRateLoading(false);
      setRateAge(0);
    }, 800);

    return () => clearTimeout(timeout);
  }, [destination.id, isConversion]);

  useEffect(() => {
    if (!isConversion || !rate || rateLoading) return;
    const id = setInterval(() => {
      setRateAge(a => {
        const next = a + 1;
        if (next >= 30) setRateStale(true);
        return next;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [isConversion, rate, rateLoading]);

  const refreshRate = () => {
    if (!rateStale) return;
    setRateLoading(true);
    setRate(null);
    setRateAge(0);
    setRateStale(false);
    setTimeout(() => {
      setRate(getSimulatedRate(origin.id, destination.id));
      setRateLoading(false);
    }, 1200);
  };

  const handleFlip = () => {
    if (!isConversion || !rate) return;
    setFlipPhase('out');
    setTimeout(() => {
      const wasFlipped = flipped;
      if (wasFlipped) {
        const cryptoAmt = parseFloat(rawAmount) || 0;
        setRawAmount((cryptoAmt * rate).toFixed(2));
      } else {
        const fiatAmt = parseFloat(rawAmount) || 0;
        setRawAmount((fiatAmt / rate).toFixed(6).replace(/0+$/, '') || '0');
      }
      setFlipped(!wasFlipped);
      setFlipPhase('in');
      setTimeout(() => setFlipPhase(null), 80);
    }, 80);
  };

  const handleSetDestination = (node) => {
    const newIsConversion = (origin.assetType || 'fiat') !== (node.assetType || 'fiat');
    if (!newIsConversion && flipped && rate) {
      const cryptoAmt = parseFloat(rawAmount) || 0;
      setRawAmount((cryptoAmt * rate).toFixed(2));
      setFlipped(false);
    }
    // Reset callout when switching to a new crypto destination
    if (newIsConversion && node.id !== destination.id) {
      setCalloutDismissed(false);
    }
    setDestinationNode(node);
  };

  const currentUnit = flipped ? getAssetUnit(destination) : getAssetUnit(origin);

  const amountInOriginUnits = flipped
    ? String((parseFloat(rawAmount)||0) * (rate||1))
    : rawAmount;

  const amountInDestinationUnits = isConversion && rate
    ? flipped
      ? rawAmount
      : String(((parseFloat(rawAmount)||0) / (rate||1)).toFixed(6))
    : rawAmount;

  return {
    origin, destination, rawAmount, setRawAmount,
    flipped, setFlipped, flipPhase, handleFlip,
    isConversion, rate, rateAge, rateLoading, rateStale, refreshRate,
    calloutDismissed, setCalloutDismissed,
    currentUnit,
    setOrigin: setOriginNode,
    setDestination: handleSetDestination,
    amountInOriginUnits, amountInDestinationUnits,
  };
}

/* ─── AWARENESS CALLOUT ─── */
function AwarenessCallout({ config, destination, onDismiss, visible }) {
  const asset = getAssetUnit(destination);
  const text = config.id === 'deposit-card'
    ? `Buying ${asset} at market rate. A spread applies to this conversion.`
    : config.id.includes('withdrawal')
    ? `Converting to ${asset} at market rate. A spread applies.`
    : `Buying ${asset} at market rate. A spread applies to this conversion.`;

  return (
    <div style={{
      margin: '8px 16px 0',
      background: '#201A0D',
      border: '0.5px solid #FAC461',
      borderRadius: 8,
      padding: '10px 12px',
      display: 'flex',
      gap: 8,
      alignItems: 'flex-start',
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(-8px)',
      transition: 'opacity 0.2s ease-out, transform 0.2s ease-out',
    }}>
      <span style={{fontSize: 14, color: '#FAC461', flexShrink: 0, lineHeight: '18px'}}>ℹ</span>
      <span style={{fontSize: 13, color: '#F0F2FA', flex: 1, lineHeight: 1.4}}>{text}</span>
      <button
        onMouseDown={e => { e.preventDefault(); onDismiss(); }}
        style={{background:'none', border:'none', cursor:'pointer', fontSize:14, color:'#A89060', flexShrink:0, padding:0, lineHeight:1}}
      >✕</button>
    </div>
  );
}

/* ─── MAIN WIDGET ─── */
function TransactionWidget({ config }) {
  // A2A hook — manages origin/destination/amount/conversion state
  const txState = useTransactionState(config, config.origin, config.destination);
  const {
    origin, destination, rawAmount, setRawAmount,
    flipped, flipPhase,
    isConversion, rate, rateAge: convRateAge, rateLoading, rateStale: convRateStale, refreshRate,
    calloutDismissed, setCalloutDismissed,
    currentUnit: hookCurrentUnit,
    setOrigin, setDestination,
  } = txState;

  // For non-conversion screens: keep existing quote-expiry state
  const [keypadOpen, setKeypadOpen] = useState(false);
  const [sheetTarget, setSheetTarget] = useState(null);
  const [swapAnim, setSwapAnim] = useState(false);
  const [quoteRateAge, setQuoteRateAge] = useState(0);
  const [quoteRateStale, setQuoteRateStale] = useState(false);
  const [rateRefreshing, setRateRefreshing] = useState(false);
  const [apiError, setApiError] = useState(null);
  useEffect(() => { window.__setApiError = setApiError; return () => { window.__setApiError = null; }; }, []);
  const quoteRateStaleRef = useRef(quoteRateStale);
  quoteRateStaleRef.current = quoteRateStale;

  // Quote expiry countdown for State A (non-conversion)
  useEffect(() => {
    if (!config.quoteExpiry) return;
    setQuoteRateAge(0); setQuoteRateStale(false);
    const id = setInterval(() => {
      setQuoteRateAge(a => {
        const next = a + 1;
        if (next >= 30 && !quoteRateStaleRef.current) setQuoteRateStale(true);
        return next;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [config.id, config.quoteExpiry, isConversion]);

  // When entering conversion mode, stop the State A quote timer from blocking CTA
  const effectiveQuoteStale = isConversion ? false : quoteRateStale;

  const handleRefreshQuote = () => {
    if (!quoteRateStale) return;
    setRateRefreshing(true);
    setTimeout(() => {
      setRateRefreshing(false);
      setQuoteRateStale(false);
      setQuoteRateAge(0);
    }, 1200);
  };

  // Amount validation
  const numAmt = parseFloat(rawAmount) || 0;
  const available = config.availableBalance || 99999;
  const hasUnlimitedBalance = config.availableBalanceDisplay === 'unlimited' || config.availableBalance >= 99999;
  const minEquiv = 10;

  // In conversion mode, validate the fiat-equivalent amount against available balance
  // conversionRate: USD per 1 crypto unit (inverse of rate which is crypto/USD)
  const conversionRate = (isConversion && rate) ? (1 / rate) : null;
  const baseAmt = isConversion && conversionRate
    ? (flipped ? numAmt * conversionRate : numAmt)           // if in crypto: convert to fiat for comparison
    : (flipped && config.fiatRate ? numAmt / config.fiatRate : numAmt);

  const overBalance = !hasUnlimitedBalance && baseAmt > available && rawAmount !== '';
  const belowMin = numAmt > 0 && (flipped && config.fiatRate ? numAmt < minEquiv : numAmt * (config.fiatRate || 1) < minEquiv);

  const amtError = overBalance
    ? `Exceeds available balance of ${config.availableBalanceDisplay || config.availableBalance + ' ' + config.availableUnit}.`
    : belowMin
    ? 'Minimum amount is $10.'
    : apiError
    ? apiError.message
    : null;

  const effectiveMax = apiError && apiError.maxAmount != null ? apiError.maxAmount : null;

  // CTA disabled logic
  const conversionStale = isConversion && convRateStale;
  const ctaDisabled = !!amtError || !numAmt || effectiveQuoteStale || conversionStale || (isConversion && rateLoading);
  const ctaCfgLabel = deriveCTALabel(config, destination, isConversion);
  const ctaLabel = apiError && apiError.type === 'unsettled'
    ? 'Funds settling'
    : effectiveQuoteStale
    ? 'Refresh quote to continue'
    : conversionStale
    ? 'Refresh rate to continue'
    : ctaCfgLabel;

  // The actual flip handler to use
  // For conversion mode: use the hook's handleFlip (handles amount conversion with rate)
  // For legacy mode (config.canFlip + config.fiatRate): convert using config.fiatRate
  const handleFlip = isConversion
    ? txState.handleFlip
    : (() => {
        if (!config.canFlip || !config.fiatRate) return () => {};
        return () => {
          const wasFlipped = flipped;
          if (wasFlipped) {
            const fiatVal = parseFloat(rawAmount) || 0;
            const assetVal = fiatVal / config.fiatRate;
            setRawAmount(assetVal.toFixed(5).replace(/\.?0+$/, '') || '0');
          } else {
            const assetVal = parseFloat(rawAmount) || 0;
            const fiatVal = assetVal * config.fiatRate;
            setRawAmount(fiatVal.toFixed(2));
          }
          txState.setFlipped(!wasFlipped);
        };
      })();

  // Max button
  const handleMax = () => {
    const bal = config.availableBalance;
    if (flipped && config.fiatRate) {
      setRawAmount((bal * config.fiatRate).toFixed(2));
    } else {
      setRawAmount(typeof bal === 'number' && bal < 1 ? bal.toFixed(5) : String(bal));
    }
  };

  // Keypad input
  const handleKey = (k) => {
    if (k === '⌫') {
      setRawAmount(prev => prev.length <= 1 ? '0' : prev.slice(0, -1));
    } else if (k === '.') {
      if (!rawAmount.includes('.')) setRawAmount(prev => (prev === '0' ? '0.' : prev + '.'));
    } else {
      setRawAmount(prev => {
        if (prev === '0') return k;
        const parts = prev.split('.');
        // Max 8 decimal places for crypto precision
        if (parts[1] !== undefined && parts[1].length >= 8) return prev;
        // Max 7 integer digits (9,999,999) — keeps total ≤ 10 chars including decimal
        if (parts[0].length >= 7 && !prev.includes('.')) return prev;
        return prev + k;
      });
    }
  };

  // Swap rows (trade only) — convert amount to new origin's unit
  const handleSwap = () => {
    setSwapAnim(true);
    setTimeout(() => {
      const currentAmt = parseFloat(rawAmount) || 0;

      // Derive USD value per 1 unit of each asset using simulated rates
      // getSimulatedRate returns crypto-per-USD, so USD-per-unit = 1 / rate
      const originRatePerUSD = getSimulatedRate(null, origin.id);   // e.g. 0.00031 ETH/USD
      const destRatePerUSD   = getSimulatedRate(null, destination.id); // e.g. 0.000018 BTC/USD

      // Fallback to config.fiatRate for the origin if available (more accurate)
      const originUSDPerUnit = config.fiatRate
        ? config.fiatRate                              // e.g. 3250 USD per ETH
        : (originRatePerUSD ? 1 / originRatePerUSD : 1);

      const destUSDPerUnit = destRatePerUSD ? 1 / destRatePerUSD : 1;

      // new amount in destination units = old amount × (origin USD value / dest USD value)
      const newAmt = currentAmt * (originUSDPerUnit / destUSDPerUnit);
      const decimals = newAmt < 0.001 ? 8 : newAmt < 1 ? 6 : newAmt < 1000 ? 4 : 2;
      setRawAmount(newAmt.toFixed(decimals).replace(/\.?0+$/, '') || '0');

      setOrigin(destination);
      setDestination(origin);
      setSwapAnim(false);
    }, 90);
  };

  // Equiv line
  const equivText = (() => {
    if (isConversion) {
      if (!rate) return null;
      const destUnit = getAssetUnit(destination);
      const originUnit = getAssetUnit(origin);
      if (flipped) {
        return `≈ $${((parseFloat(rawAmount)||0) / rate).toFixed(2)} at current rate`;
      } else {
        const converted = ((parseFloat(rawAmount)||0) * rate * 0.995).toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
        return `≈ ${converted} ${destUnit} at current rate`;
      }
    }
    if (config.equivText) return config.equivText(rawAmount, flipped);
    if (flipped && config.equivLineFlipped) return config.equivLineFlipped(rawAmount);
    if (config.equivLine) return config.equivLine(rawAmount, flipped);
    return null;
  })();

  // Current unit (for display)
  // Always derive unit from the hook so it updates correctly after a swap
  const currentUnit = hookCurrentUnit;

  // Receive value
  const receiveVal = config.receiveValue
    ? config.receiveValue(rawAmount, flipped, effectiveQuoteStale)
    : '—';
  const receiveSub = config.receiveSub
    ? config.receiveSub(rawAmount, flipped, effectiveQuoteStale)
    : '';

  const currencySymbol = getCurrencySymbol(currentUnit);
  const isFiat = !!currencySymbol;
  const quickAmts = getQuickAmounts(flipped ? (config.fiatUnit || config.defaultUnit) : config.defaultUnit);
  const readOnly = !!config.isAmountReadOnly;
  const isEmpty = !rawAmount || rawAmount === '0';

  const numDispCls = [
    'amount-display-number',
    isEmpty ? 'is-zero' : '',
    amtError ? 'error' : '',
    flipPhase === 'out' ? 'flip-out' : '',
    flipPhase === 'in' ? 'flip-in' : '',
  ].filter(Boolean).join(' ');

  // Responsive font size: scale down as the number grows
  const amtLen = (rawAmount || '0').replace('.', '').length;
  const amtFontSize = amtLen <= 4 ? 64 : amtLen <= 6 ? 52 : amtLen <= 8 ? 42 : amtLen <= 10 ? 34 : 26;

  // Fee / rate display — State A (non-conversion)
  const quoteRemaining = Math.max(0, 30 - quoteRateAge);
  const feeRowValue = (() => {
    if (effectiveQuoteStale) return <span style={{ color: T.warning, cursor: 'pointer' }} onClick={handleRefreshQuote}>Tap to refresh</span>;
    if (rateRefreshing) return <div className="fee-shimmer" />;
    return config.feeValue;
  })();
  const settlementValue = (() => {
    if (config.quoteExpiry && !effectiveQuoteStale && !rateRefreshing) return (
      <span style={{ display:'flex', alignItems:'center', gap: 4 }}>
        <span className="live-dot" style={{ display:'inline-block' }} />
        <span style={{ color: quoteRemaining <= 10 ? T.warning : T.textMuted }}>Quote valid for {quoteRemaining}s</span>
      </span>
    );
    if (config.quoteExpiry && effectiveQuoteStale) return <span style={{ color: T.warning }}>Quote expired</span>;
    return config.feeTiming;
  })();

  return (
    <div className="widget-frame">
      {/* Status bar */}
      <div className="status-bar">
        <span className="status-time">9:41</span>
        <div className="status-icons">
          <span>●●●</span>
          <span>WiFi</span>
          <span>🔋</span>
        </div>
      </div>

      {/* Nav bar — back arrow */}
      <div className="nav-bar">
        <div className="nav-close" style={{ fontSize: 16 }}>←</div>
        <div className="nav-title">{config.title}</div>
        <div className="nav-spacer" />
      </div>

      {/* ── Amount zone ── */}
      <div
        className={`amount-zone ${!readOnly && keypadOpen ? 'active' : ''}`}
        onClick={() => { if (!readOnly) setKeypadOpen(true); }}
        style={readOnly ? { cursor: 'default' } : {}}
      >
        {/* Big number row: $50 or 0.05 BTC */}
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
          {isFiat && (
            <span className="amount-display-currency" style={{ fontSize: Math.round(amtFontSize * 0.56), color: isEmpty ? T.textMuted : (amtError ? T.error : 'inherit'), transition: 'font-size 0.15s ease' }}>
              {currencySymbol}
            </span>
          )}
          <span className={numDispCls} style={{ fontSize: amtFontSize, transition: 'font-size 0.15s ease, color 0.12s ease' }}>{rawAmount || '0'}</span>
          {!isFiat && (
            <span style={{ fontSize: Math.max(14, Math.round(amtFontSize * 0.31)), color: T.textMuted, fontWeight: 400, marginLeft: 4, lineHeight: 1, transition: 'font-size 0.15s ease' }}>
              {currentUnit}
              {readOnly && <span style={{ fontSize: 12, marginLeft: 6, verticalAlign: 'middle' }}>🔒</span>}
            </span>
          )}
        </div>

        {/* Charged / equiv line */}
        <div className="amount-charged-line">
          {origin.icon && (
            <div className="amount-charged-icon" style={{ background: iconColors(origin.iconColor).bg, color: iconColors(origin.iconColor).txt }}>
              {typeof origin.icon === 'string' && origin.icon.length <= 2 ? origin.icon : '·'}
            </div>
          )}
          <span className="amount-charged-text">{equivText || (isFiat ? `Charged to ${origin.name}` : `≈ $${(parseFloat(rawAmount||0) * (config.fiatRate||1)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`)}</span>
          {!readOnly && (isConversion ? rate != null : (config.canFlip && config.fiatRate)) && (
            <button
              className={`flip-pill ${isEmpty ? 'dimmed' : ''}`}
              style={{ marginLeft: 6 }}
              onMouseDown={e => { e.stopPropagation(); handleFlip(); }}
            >
              ⇅ {flipped ? getAssetUnit(origin) : getAssetUnit(destination)}
            </button>
          )}
        </div>

        {amtError && <div className="amount-error">{amtError}</div>}
      </div>

      {/* Quick-pick pills */}
      {!readOnly && quickAmts.length > 0 && (
        <div className="quick-pills">
          {quickAmts.map(q => (
            <button
              key={q}
              className="quick-pill"
              onMouseDown={e => { e.preventDefault(); setRawAmount(parseQuickAmount(q)); setKeypadOpen(false); }}
            >
              {q}
            </button>
          ))}
          {config.hasMax && (
            <button
              className="quick-pill"
              onMouseDown={e => {
                e.preventDefault();
                if (effectiveMax != null) {
                  setRawAmount(String(effectiveMax));
                  setApiError(null);
                } else {
                  handleMax();
                }
                setKeypadOpen(false);
              }}
            >
              {effectiveMax != null ? `$${effectiveMax.toLocaleString()}` : 'Max'}
            </button>
          )}
        </div>
      )}

      {/* ── Node card group ── */}
      <div className="node-card-group" style={{ marginTop: 16 }}>
        {/* Origin card */}
        <div
          className={`node-card top ${swapAnim ? 'swap-animate' : ''}`}
          onClick={() => config.origin.options?.length && setSheetTarget('origin')}
          style={{ cursor: config.origin.options?.length ? 'pointer' : 'default' }}
        >
          <div className="node-card-inner">
            <div className="node-card-zone">{(config.zoneLabels && config.zoneLabels.origin) || 'Origin'}</div>
            <div className="node-card-row">
              <div className="node-card-icon" style={{ background: iconColors(origin.iconColor).bg, color: iconColors(origin.iconColor).txt }}>
                {origin.icon}
              </div>
              <div className="node-card-text">
                <div className="node-card-name">{origin.name}</div>
                <div className="node-card-sub">
                  {origin.sub.split(' · ').map((part, i, arr) => (
                    <React.Fragment key={i}>
                      {i > 0 && <span className="node-card-sub-dot" />}
                      <span>{part}</span>
                    </React.Fragment>
                  ))}
                </div>
              </div>
              {origin.rightSub ? (
                <div className="node-card-trailing">
                  <span className="node-card-val">{origin.rightVal}</span>
                  <span className="node-card-val-sub">{origin.rightSub}</span>
                </div>
              ) : null}
            </div>
          </div>
          {config.origin.options?.length > 0 && <div className="node-card-chevron">∨</div>}
        </div>

        {/* Destination card */}
        <div
          className={`node-card bottom ${swapAnim ? 'swap-animate' : ''}`}
          onClick={() => config.destination.options?.length && setSheetTarget('destination')}
          style={{ cursor: config.destination.options?.length ? 'pointer' : 'default' }}
        >
          <div className="node-card-inner">
            <div className="node-card-zone">{(config.zoneLabels && config.zoneLabels.destination) || 'Destination'}</div>
            <div className="node-card-row">
              <div className="node-card-icon" style={{ background: iconColors(destination.iconColor).bg, color: iconColors(destination.iconColor).txt }}>
                {destination.icon}
              </div>
              <div className="node-card-text">
                <div className="node-card-name">{destination.name}</div>
                <div className="node-card-sub">
                  {destination.sub.split(' · ').map((part, i) => (
                    <React.Fragment key={i}>
                      {i > 0 && <span className="node-card-sub-dot" />}
                      <span>{part}</span>
                    </React.Fragment>
                  ))}
                </div>
              </div>
              {(destination.rightVal || destination.rightSub) && (
                <div className="node-card-trailing">
                  <span className="node-card-val">{destination.rightVal}</span>
                  {destination.rightSub && <span className="node-card-val-sub">{destination.rightSub}</span>}
                </div>
              )}
            </div>
          </div>
          {config.destination.options?.length > 0 && <div className="node-card-chevron">∨</div>}
        </div>

        {/* Connector between cards */}
        <div
          className={`node-card-connector ${config.swappable ? 'swappable' : ''}`}
          onClick={config.swappable ? handleSwap : undefined}
        >
          {config.swappable ? '⇅' : '↓'}
        </div>
      </div>

      {/* Awareness callout for conversion mode */}
      {isConversion && !calloutDismissed && (
        <AwarenessCallout
          config={config}
          destination={destination}
          onDismiss={() => setCalloutDismissed(true)}
          visible={isConversion && !calloutDismissed}
        />
      )}

      {/* ── Fee rows ── */}
      {isConversion ? (
        <div className={`fee-rows${convRateStale ? ' stale' : ''}`} style={convRateStale ? {border: '0.5px solid ' + T.warning, borderRadius: 8, margin: '4px 16px 0'} : {}}>
          {rateLoading ? (
            <>
              <div className="fee-row">
                <span className="fee-row-label">Exchange rate</span>
                <div className="fee-shimmer" style={{width: 120}} />
              </div>
              <div className="fee-row">
                <span className="fee-row-label">Spread</span>
                <div className="fee-shimmer" style={{width: 60}} />
              </div>
            </>
          ) : rate ? (
            <>
              <div className="fee-row">
                <span className="fee-row-label">
                  {convRateStale ? 'Rate expired' : `Rate · 1 ${getAssetUnit(origin)} = ${(rate * (1 - 0.005)).toFixed(6)} ${getAssetUnit(destination)}`}
                </span>
                {!convRateStale ? (
                  <span className="fee-row-value" style={{display:'flex', gap:4, alignItems:'center'}}>
                    <span className="live-dot" />
                    <span style={{fontSize:11, color: convRateAge <= 10 ? T.textMuted : T.warning}}>
                      {convRateAge}s
                    </span>
                  </span>
                ) : (
                  <span style={{fontSize:13, color: T.warning, cursor:'pointer'}} onClick={refreshRate}>Tap to refresh</span>
                )}
              </div>
              <div className="fee-row">
                <span className="fee-row-label">Spread</span>
                <span className="fee-row-value">0.5%</span>
              </div>
              {!convRateStale && (
                <div className="fee-row" style={{paddingTop: 4, paddingBottom: 4}}>
                  <span></span>
                  <span style={{fontSize:11, color: (30 - convRateAge) <= 10 ? T.warning : T.textMuted}}>
                    Quote valid for {Math.max(0, 30 - convRateAge)}s
                  </span>
                </div>
              )}
            </>
          ) : null}
        </div>
      ) : (
        <div className="fee-rows">
          <div className="fee-row">
            <span className="fee-row-label">
              {effectiveQuoteStale ? 'Quote expired' : config.feeLabel}
              {!effectiveQuoteStale && !config.quoteExpiry && <span className="fee-row-info">i</span>}
            </span>
            <span className="fee-row-value">{feeRowValue}</span>
          </div>
          <div className="fee-row">
            <span className="fee-row-label">Settlement time</span>
            <span className="fee-row-value">{settlementValue}</span>
          </div>
        </div>
      )}

      {/* Unsettled info row — stays inside frame so it reads in-context */}
      {apiError && apiError.type === 'unsettled' && (
        <div style={{ margin: '6px 16px 0', padding: '8px 12px', background: T.surfaceRaised, borderRadius: 6, display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ fontSize: 14 }}>🕐</span>
          <span
            style={{ fontSize: 12, color: T.textSecondary, cursor: 'pointer', textDecoration: 'underline' }}
            onClick={() => alert('Some funds are still settling from a recent deposit. Settling funds become available once confirmed by the network or bank.')}
          >Why are my funds locked?</span>
        </div>
      )}

      {/* Tap-outside backdrop */}
      <div
        className={`keypad-backdrop ${keypadOpen ? 'open' : ''}`}
        onMouseDown={() => setKeypadOpen(false)}
      />

      {/* Floating keypad + CTA panel */}
      <div className="keypad-cta-panel">
        {!readOnly && (
          <>
            <div className={`keypad-dismiss-bar ${keypadOpen ? 'open' : ''}`}>
              <button className="keypad-done-btn" onMouseDown={e => { e.preventDefault(); setKeypadOpen(false); }}>
                Done
              </button>
            </div>
            <div className={`keypad-slide ${keypadOpen ? 'open' : ''}`}>
              <div className="keypad">
                {['1','2','3','4','5','6','7','8','9','.','0','⌫'].map((k, i) => (
                  <button key={i} className={`keypad-key ${k==='⌫'?'backspace':''}`} onMouseDown={e=>{e.preventDefault();handleKey(k);}}>
                    {k}
                  </button>
                ))}
              </div>
            </div>
          </>
        )}
        <div className="cta-zone">
          <button className="cta-btn" disabled={ctaDisabled}>
            {ctaLabel}
          </button>
        </div>
        <div className="cta-legal">
          By continuing, I am accepting Uphold's{' '}
          <span className="link">Terms and Conditions</span>{' '}
          and{' '}
          <span className="link">Privacy Policy</span>.
        </div>
        <div className="powered-by">
          <span style={{ fontSize: 16 }}>🌿</span>
          <span className="powered-by-text">Powered by <strong>Uphold</strong></span>
        </div>
      </div>

      {/* Bottom sheets */}
      {sheetTarget === 'origin' && (
        <BottomSheet open={true} onClose={() => setSheetTarget(null)} title="Select origin"
          items={config.origin.options||[]} selectedId={origin.id} onSelect={item => setOrigin(item)} grouped={false} />
      )}
      {sheetTarget === 'destination' && (
        <BottomSheet open={true} onClose={() => setSheetTarget(null)} title="Select destination"
          items={config.destination.options||[]} selectedId={destination.id} onSelect={item => setDestination(item)}
          grouped={!!config.supportsAnythingToAnything} />
      )}
    </div>
  );
}

/* ─── BANK INSTRUCTION WIDGET ─── */
function BankInstructionWidget({ config }) {
  const [copiedField, setCopiedField] = useState(null); // key string being copied
  const [toastVisible, setToastVisible] = useState(false);
  const toastTimerRef = useRef(null);

  const copyText = (text, key) => {
    navigator.clipboard.writeText(text).catch(() => {});
    setCopiedField(key);
    clearTimeout(toastTimerRef.current);
    setToastVisible(true);
    setTimeout(() => setCopiedField(null), 1400);
    toastTimerRef.current = setTimeout(() => setToastVisible(false), 2000);
  };

  const ic = config.destinationAccount ? iconColors(config.destinationAccount.iconColor) : iconColors('teal');

  return (
    <div className="widget-frame" style={{ position: 'relative' }}>
      {/* Status bar */}
      <div className="status-bar">
        <span className="status-time">9:41</span>
        <div className="status-icons"><span>●●●</span><span>WiFi</span><span>🔋</span></div>
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <div className="nav-close" style={{ fontSize: 16 }}>←</div>
        <div className="nav-title">{config.title || 'Add funds'}</div>
        <div className="nav-spacer" />
      </div>

      {/* Info banner */}
      {config.infoBanner && (
        <div style={{ margin: '0 16px 12px', padding: 12, background: '#FFF8EC', border: '0.5px solid #FAC461', borderRadius: 8, display: 'flex', gap: 8, alignItems: 'flex-start' }}>
          <span style={{ fontSize: 14, flexShrink: 0 }}>ℹ</span>
          <span style={{ fontSize: 13, color: '#344070', lineHeight: 1.4 }}>{config.infoBanner}</span>
        </div>
      )}

      {/* Reference code zone */}
      {config.referenceCode && (
        <div style={{ padding: '0 16px 12px' }}>
          <div className="zone-label">PAYMENT REFERENCE</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6, flexWrap: 'nowrap' }}>
            {config.referenceCode.split('').map((ch, i) => (
              <div key={i} style={{ width: 28, height: 34, background: T.surfaceRaised, border: `0.5px solid ${T.line}`, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 600, fontFamily: 'monospace', color: T.textPrimary, flexShrink: 0 }}>
                {ch}
              </div>
            ))}
            <button
              onMouseDown={e => { e.preventDefault(); copyText(config.referenceCode, 'ref'); }}
              style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 16, color: copiedField === 'ref' ? T.success : T.textMuted, flexShrink: 0, marginLeft: 2, lineHeight: 1 }}
            >{copiedField === 'ref' ? '✓' : '⎘'}</button>
          </div>
          <div style={{ fontSize: 12, color: T.textMuted, marginTop: 6, lineHeight: 1.4 }}>
            Include this reference in your transfer. Transfers without it may be delayed.
          </div>
        </div>
      )}

      {/* Transfer details zone */}
      {config.details && config.details.length > 0 && (
        <div style={{ padding: '0 16px 12px' }}>
          <div className="zone-label">TRANSFER TO</div>
          <div style={{ marginTop: 4, background: T.cardBg, borderRadius: 12, overflow: 'hidden' }}>
            {config.details.map((d, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', padding: '10px 12px', borderTop: i === 0 ? 'none' : `0.5px solid ${T.line}` }}>
                <span style={{ fontSize: 12, color: T.textMuted, width: 110, flexShrink: 0 }}>{d.label}</span>
                <span style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary, flex: 1 }}>{d.value}</span>
                <button
                  onMouseDown={e => { e.preventDefault(); copyText(d.value, `detail-${i}`); }}
                  style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 16, color: copiedField === `detail-${i}` ? T.success : T.textMuted, flexShrink: 0 }}
                >{copiedField === `detail-${i}` ? '✓' : '⎘'}</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Destination + settlement zone */}
      {config.destinationAccount && (
        <div style={{ padding: '0 16px 12px' }}>
          <div className="zone-label">DESTINATION</div>
          <div style={{ marginTop: 4, background: T.cardBg, borderRadius: 12, overflow: 'hidden', padding: '10px 12px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
              <div style={{ width: 32, height: 32, borderRadius: '50%', background: ic.bg, color: ic.txt, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 14, flexShrink: 0 }}>
                {config.destinationAccount.icon}
              </div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary }}>{config.destinationAccount.name}</div>
                <div style={{ fontSize: 12, color: T.textMuted }}>{config.destinationAccount.sub}</div>
              </div>
            </div>
            <div style={{ borderTop: `0.5px solid ${T.line}`, paddingTop: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 13, color: T.textMuted }}>Processing time</span>
              <span style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary }}>{config.settlement}</span>
            </div>
          </div>
        </div>
      )}

      {/* Note badge */}
      {config.noteBadge && (
        <div style={{ margin: '0 16px 12px', padding: '8px 12px', background: '#FFF8EC', border: '0.5px solid #FAC461', borderRadius: 8 }}>
          <span style={{ fontSize: 12, color: '#8C5A00', lineHeight: 1.4 }}>{config.noteBadge}</span>
        </div>
      )}

      {/* Toast */}
      <div style={{
        position: 'absolute', bottom: 88, left: '50%', transform: `translateX(-50%) translateY(${toastVisible ? 0 : 20}px)`,
        opacity: toastVisible ? 1 : 0, transition: 'opacity 0.2s, transform 0.2s',
        background: T.surfaceRaised, border: `0.5px solid ${T.line}`, borderRadius: 9999,
        padding: '8px 16px', fontSize: 13, color: T.textPrimary, zIndex: 20, whiteSpace: 'nowrap', pointerEvents: 'none',
      }}>
        Copied to clipboard
      </div>

      {/* CTA zone */}
      <div className="keypad-cta-panel">
        <div className="cta-zone">
          <button className="cta-btn">{config.ctaLabel || 'Close'}</button>
        </div>
        <div className="cta-legal">
          By continuing, I am accepting Uphold's{' '}
          <span className="link">Terms and Conditions</span>{' '}
          and{' '}
          <span className="link">Privacy Policy</span>.
        </div>
        <div className="powered-by">
          <span style={{ fontSize: 16 }}>🌿</span>
          <span className="powered-by-text">Powered by <strong>Uphold</strong></span>
        </div>
      </div>
    </div>
  );
}

/* ─── DEMO ERROR PANEL (reviewer shell only) ─── */
const DEMO_ERRORS = [
  { key: 'min',       label: 'Min',       error: { type: 'min',       message: 'Minimum amount is $10.' } },
  { key: 'max',       label: 'Max',       error: { type: 'max',       message: 'Maximum amount is $5,000.',              maxAmount: 5000  } },
  { key: 'daily',     label: 'Daily',     error: { type: 'daily',     message: 'Daily limit reached. $1,200.00 remaining today.',    maxAmount: 1200  } },
  { key: 'weekly',    label: 'Weekly',    error: { type: 'weekly',    message: 'Weekly limit reached. $3,500.00 remaining this week.', maxAmount: 3500 } },
  { key: 'unsettled', label: 'Unsettled', error: { type: 'unsettled', message: 'Funds settling. $300.00 available on Jun 12.' } },
];

function DemoPanel({ activeError, onSet }) {
  return (
    <div style={{
      width: 393,
      marginTop: 16,
      background: T.surface,
      border: `0.5px solid ${T.line}`,
      borderRadius: 10,
      padding: '10px 14px',
      display: 'flex',
      flexDirection: 'column',
      gap: 8,
    }}>
      <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: '1.5px', textTransform: 'uppercase', color: T.textMuted }}>
        Demo — error states
      </span>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
        {DEMO_ERRORS.map(({ key, label, error }) => {
          const active = activeError && activeError.type === key;
          return (
            <button
              key={key}
              onMouseDown={e => {
                e.preventDefault();
                if (window.__setApiError) window.__setApiError(prev => prev && prev.type === key ? null : error);
                onSet(active ? null : error);
              }}
              style={{
                fontSize: 11, fontWeight: 600, fontFamily: 'inherit',
                padding: '4px 10px', borderRadius: 6, cursor: 'pointer',
                border: `0.5px solid ${active ? T.error : T.line}`,
                background: active ? '#FFE8E3' : T.surfaceRaised,
                color: active ? T.error : T.textMuted,
                transition: 'background 0.12s, color 0.12s, border-color 0.12s',
              }}
            >{label}</button>
          );
        })}
      </div>
      {activeError && (
        <div style={{ fontSize: 11, color: T.textMuted, fontStyle: 'italic', lineHeight: 1.4 }}>
          {activeError.message}
        </div>
      )}
    </div>
  );
}

/* ─── REVIEWER SHELL ─── */
function App() {
  const [activeId, setActiveId] = useState(USE_CASES[0].id);
  const [fadingOut, setFadingOut] = useState(false);
  const [displayedId, setDisplayedId] = useState(USE_CASES[0].id);
  const [demoError, setDemoError] = useState(null);

  const switchTo = useCallback((id) => {
    if (id === activeId) return;
    // Clear demo error on screen switch
    setDemoError(null);
    if (window.__setApiError) window.__setApiError(null);
    setFadingOut(true);
    setTimeout(() => {
      setDisplayedId(id);
      setActiveId(id);
      setFadingOut(false);
    }, 150);
  }, [activeId]);

  const activeUC = USE_CASES.find(uc => uc.id === displayedId) || USE_CASES[0];

  // Test hook for prototype reviewer navigation
  useEffect(() => { window.__selectUseCase = switchTo; }, [switchTo]);

  return (
    <div className="reviewer-shell">
      <div className="reviewer-title">Uphold Payment Widget · Amount Selection</div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 10, width: 440, marginBottom: 16, flexShrink: 0 }}>
        <div style={{ flex: 1 }}>
          <GroupedDropdown useCases={USE_CASES} activeId={activeId} onChange={switchTo} inlineMode />
        </div>
        <button
          onMouseDown={e => { e.preventDefault(); window.location.reload(); }}
          title="Reload prototype"
          style={{
            flexShrink: 0,
            width: 40, height: 48,
            background: T.surface,
            border: `0.5px solid ${T.line}`,
            borderRadius: 8,
            cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 18, color: T.textMuted,
            transition: 'color 0.15s, border-color 0.15s',
          }}
          onMouseEnter={e => { e.currentTarget.style.color = T.green; e.currentTarget.style.borderColor = T.green; }}
          onMouseLeave={e => { e.currentTarget.style.color = T.textMuted; e.currentTarget.style.borderColor = T.line; }}
        >↺</button>
      </div>

      {activeUC.annotation && <PrototypeAnnotation text={activeUC.annotation} />}

      <div className="screen-stage" style={{ flexDirection: 'column', alignItems: 'center' }}>
        <div className="screen-fade" style={{ opacity: fadingOut ? 0 : 1 }}>
          {activeUC.screenType === 'bank-instruction'
            ? <BankInstructionWidget key={activeUC.id} config={activeUC} />
            : <TransactionWidget key={activeUC.id} config={activeUC} />
          }
        </div>

        {/* Demo panel — only on amount-selection screens, outside the phone frame */}
        {activeUC.screenType !== 'bank-instruction' && (
          <DemoPanel
            activeError={demoError}
            onSet={err => {
              setDemoError(err);
              if (window.__setApiError) window.__setApiError(err);
            }}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
