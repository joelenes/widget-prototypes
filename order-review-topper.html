<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review Your Order — Recurring Buy Prototype</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap');

  :root {
    /* Color tokens — Order review, Revamp (Figma node 44959-185787) */
    --bg-level-1:        #141C29;
    --bg-level-2:        #1D2738;
    --bg-level-3:        #273149;
    --bg-success-soft:   #03290C;
    --bg-info:           #7AB2FF;
    --border-default:    #35415F;
    --border-primary:    #84FB7F;
    --content-default:   #D5D7E7;
    --content-emphasis:  #F7F8FC;
    --content-subdued:   #8897BF;
    --content-primary:   #84FB7F;
    --content-success:   #6FE68A;
    --content-on-primary: #001F02;
    --content-on-ghost:  #84FB7F;
    --action-primary:    #84FB7F;
    --action-neutral-soft: rgba(53,65,95,0.3);
    --action-agnostic-hover: rgba(53,65,95,0.3);
    --action-agnostic-pressed: rgba(53,65,95,0.5);
    --action-agnostic-disabled: rgba(53,65,95,0.2);
    --border-disabled:   #273149;
    --content-disabled:  #495A83;
    --focus-default:     #579DFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: #0B0F17;
    /* Proxima Nova is the product font; falls back until a licensed woff2 is wired up. */
    font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--content-default);
  }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 56px;
  }

  .stage-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5B6885;
    margin-bottom: 16px;
  }

  /* ── Typography scale (desktop/* text styles from Figma) ── */
  .h1 { font-size: 31px; line-height: 40px; font-weight: 700; }
  .h2 { font-size: 24px; line-height: 32px; font-weight: 700; color: var(--content-emphasis); }
  .h3 { font-size: 20px; line-height: 24px; font-weight: 700; }
  .p1 { font-size: 17px; line-height: 24px; font-weight: 400; }
  .p1-strong { font-size: 17px; line-height: 24px; font-weight: 700; }
  .p2 { font-size: 15px; line-height: 20px; font-weight: 400; }
  .p2-strong { font-size: 15px; line-height: 20px; font-weight: 700; }
  .p3 { font-size: 13px; line-height: 16px; font-weight: 400; }
  .p3-strong { font-size: 13px; line-height: 16px; font-weight: 700; }
  .caption { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: 0.24px; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; line-height: 16px; letter-spacing: 1px; font-weight: 400; }

  /* ── Frame — exact MASTER-SCREEN/order-review dimensions (470x833, 32px padding, 48px radius) ── */
  .frame {
    width: 470px;
    height: 833px;
    box-sizing: border-box;
    padding: 32px;
    background: var(--bg-level-1);
    border-radius: 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  .body { display: flex; flex-direction: column; gap: 40px; width: 100%; }

  /* ── Navbar ── */
  .navbar { height: 40px; width: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 32px;
    background: var(--action-neutral-soft);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 8px;
  }
  .icon-btn img { width: 24px; height: 24px; }
  .icon-btn:focus-visible { outline: 2px solid var(--focus-default); outline-offset: 2px; }
  .navbar .icon-btn { position: absolute; top: 50%; transform: translateY(-50%); }
  .navbar .icon-btn--back { left: 0; }
  .navbar .icon-btn--menu { right: 0; }
  .navbar-logo { height: 28.295px; }

  .main-container { display: flex; flex-direction: column; gap: 32px; width: 100%; }

  .screen-title-row { display: flex; justify-content: center; width: 100%; }
  .screen-title { color: var(--content-emphasis); text-align: center; }

  /* ── Asset block ── */
  .asset-block { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
  .cards-asset-amount { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; width: 100%; }
  .asset-icon-wrap { position: relative; width: 56px; height: 56px; }
  .asset-icon-wrap img { width: 56px; height: 56px; display: block; }
  /* Width/height are set inline on these two <img> tags — a bare class selector here
     loses specificity to ".asset-icon-wrap img" and silently gets overridden to 56x56. */
  .recurring-badge-ring {
    position: absolute;
    right: -4px;
    bottom: -4px;
  }
  .recurring-badge {
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 20px;
    height: 20px;
    border-radius: 9999px;
    background: var(--bg-info);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .asset-amount-content { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
  .you-get-label { color: var(--content-subdued); text-align: center; }
  .you-get-amount { color: var(--content-default); text-align: center; }

  /* ── Frequency chip (card/frequency_v3.0) — ghost, 32px tall, rounded-8 ── */
  .frequency-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 32px;
    padding: 0 8px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--content-emphasis);
    cursor: pointer;
  }
  /* card/frequency_v3.0 — Hover/Pressed/Focus states from the design system */
  .frequency-chip:hover { background: var(--action-agnostic-hover); border-color: var(--border-default); }
  .frequency-chip:active { background: var(--action-agnostic-pressed); border-color: var(--border-default); }
  .frequency-chip:focus-visible { outline: none; border-color: var(--focus-default); }
  .frequency-chip-content { display: flex; align-items: center; gap: 8px; }
  .frequency-chip-icon { display: flex; align-items: center; padding-bottom: 2px; width: 20px; height: 20px; }
  .frequency-chip-icon img { width: 16.4px; height: 17.4px; }
  .frequency-chip-label { color: var(--content-emphasis); white-space: nowrap; }
  .frequency-chip-chevron { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
  .frequency-chip-chevron img { width: 7.5px; height: 4.5px; }

  /* ── Details cards ── */
  .details { display: flex; flex-direction: column; gap: 16px; width: 100%; }

  .card {
    background: transparent;
    border: 1px solid var(--border-default);
    border-radius: 16px;
    padding: 4px 8px 4px 16px;
    width: 100%;
  }
  .account-row { display: flex; align-items: center; gap: 16px; height: 56px; padding: 8px 0; width: 100%; }
  .icon-container { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-container img { display: block; }
  .account-main { flex: 1 0 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .account-name-row { display: flex; align-items: center; gap: 4px; width: 100%; white-space: nowrap; }
  .account-name-row .default-text { color: var(--content-default); }
  .account-name-row .emphasis-text { color: var(--content-emphasis); flex: 1 0 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .account-market-row { display: flex; align-items: center; gap: 4px; }
  .account-market-row .subdued-text { color: var(--content-subdued); }
  .bullet-dot { width: 2px; height: 2px; border-radius: 50%; background: var(--content-subdued); }
  .account-mono { color: var(--content-subdued); }

  .ghost-btn {
    position: relative;
    background: transparent;
    border: none;
    height: 36px;
    padding: 0 16px;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--content-on-ghost);
    cursor: pointer;
    flex-shrink: 0;
  }
  .ghost-btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 44px; height: 44px;
    transform: translate(-50%, -50%);
  }
  .ghost-btn:focus-visible { outline: 2px solid var(--focus-default); outline-offset: 2px; border-radius: 32px; }

  /* ── Breakdown card ── */
  .breakdown-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; }
  .breakdown-row { display: flex; align-items: center; gap: 4px; width: 100%; }
  .breakdown-label { color: var(--content-default); flex: 1 0 0; min-width: 0; }
  .breakdown-value { color: var(--content-emphasis); white-space: nowrap; flex-shrink: 0; }
  .total-fees-group { display: flex; align-items: center; gap: 8px; flex: 1 0 0; min-width: 0; }
  .see-details-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--content-subdued);
    cursor: pointer;
    text-decoration: underline;
    flex-shrink: 0;
  }
  .see-details-btn:focus-visible { outline: 2px solid var(--focus-default); outline-offset: 2px; border-radius: 4px; }

  /* ── Footer ── */
  .footer-actions { width: 100%; }
  .footer-gradient {
    height: 16px;
    width: 100%;
    background: linear-gradient(to top, var(--bg-level-1) 0%, rgba(20,28,41,0.95) 33.333%, rgba(20,28,41,0.75) 66.667%, rgba(20,28,41,0) 100%);
  }
  .footer-content { background: var(--bg-level-1); display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .frequency-note { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; padding-bottom: 12px; width: 100%; }
  .frequency-note-line { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .frequency-note-line .default-text { color: var(--content-default); }
  .frequency-note-line .discount-note { color: var(--content-primary); }
  .legal-line { color: var(--content-subdued); width: 100%; }
  .buttons-row { display: flex; gap: 16px; width: 100%; }

  .cta-btn {
    width: 100%;
    padding: 16px;
    border-radius: 32px;
    background: var(--action-primary);
    color: var(--content-on-primary);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .cta-btn:focus-visible { outline: 2px solid var(--focus-default); outline-offset: 2px; }

  /* ── Bottom sheet ── */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    animation: scrimFadeIn 260ms ease-out;
    border-radius: 48px;
  }
  .scrim.is-closing { animation: scrimFadeOut 150ms ease-in forwards; }

  .sheet {
    width: 100%;
    max-height: 88%;
    background: var(--bg-level-2);
    border-radius: 32px 32px 0 0;
    padding: 40px 32px 32px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 48px;
    animation: sheetSlideIn 280ms ease-out;
  }
  .sheet.is-closing { animation: sheetSlideOut 150ms ease-in forwards; }

  @keyframes scrimFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scrimFadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes sheetSlideIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sheetSlideOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(24px); } }

  @media (prefers-reduced-motion: reduce) {
    .scrim, .sheet, .scrim.is-closing, .sheet.is-closing { animation-duration: 200ms; }
    .sheet, .sheet.is-closing { animation-name: scrimFadeIn; transform: none; }
    .sheet.is-closing { animation-name: scrimFadeOut; }
  }

  .sheet-content { display: flex; flex-direction: column; gap: 40px; width: 100%; }

  .sheet-title-row { display: flex; align-items: flex-start; justify-content: space-between; width: 100%; }
  .sheet-title-col { display: flex; align-items: center; justify-content: center; padding: 4px 0; width: 302px; }
  .sheet-close-col { display: flex; align-items: flex-start; justify-content: center; align-self: stretch; width: 40px; }

  .sheet-body { color: var(--content-default); width: 100%; }
  .sheet-body .discount-accent { color: var(--content-primary); font-weight: 700; }

  .selection-block { display: flex; flex-direction: column; gap: 16px; width: 100%; }
  .selection-title { color: var(--content-default); width: 100%; }
  .radiogroup { display: flex; flex-direction: column; gap: 16px; width: 100%; }

  .option-card {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: transparent;
    border: 1px solid var(--border-default);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    width: 100%;
  }
  .option-card.is-selected { border-color: var(--border-primary); }
  /* cards/select-card_v3.0 (Mobile, Radiobutton) — Hover/Pressed/Focus states from the design system */
  .option-card:hover { background: var(--action-agnostic-hover); }
  .option-card:active { background: var(--action-agnostic-pressed); }
  .option-card:focus-visible { outline: none; }
  .option-card:focus-visible::after {
    content: '';
    position: absolute;
    inset: -3px;
    border: 1px solid var(--focus-default);
    border-radius: 18px;
    pointer-events: none;
  }

  .radio-hit { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: stretch; }
  .radio-visual {
    box-sizing: border-box;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--border-primary);
  }
  .radio-visual.is-selected { border-width: 6px; }
  .option-card:hover .radio-visual { border-width: 3px; background: var(--action-agnostic-hover); }
  .option-card:active .radio-visual { border-width: 3px; background: var(--action-agnostic-pressed); }
  .option-card:hover .radio-visual.is-selected { border-width: 5px; }
  .option-card:active .radio-visual.is-selected { border-width: 5px; }

  .option-body { flex: 1 0 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .option-label-row { display: flex; align-items: flex-start; gap: 8px; min-height: 22px; width: 100%; }
  .option-label { color: var(--content-default); flex: 1 0 0; min-width: 0; padding-top: 2px; }
  .option-desc { color: var(--content-subdued); flex: 1 0 0; min-width: 0; }

  .badge {
    border-radius: 8px;
    padding: 4px 12px;
  }
  .badge--neutral { background: var(--bg-level-3); color: var(--content-default); }
  .badge--success { background: var(--bg-success-soft); color: var(--content-success); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>

<div id="root"></div>

const ASSET_NAME = 'Bitcoin';

function formatChargeDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function getNextChargeDate(freqKey) {
  const now = new Date();
  if (freqKey === 'weekly') {
    const d = new Date(now);
    const day = d.getDay();
    let diff = (4 - day + 7) % 7; // next Thursday, at least a week out
    if (diff === 0) diff = 7;
    d.setDate(d.getDate() + diff);
    return d;
  }
  if (freqKey === 'monthly') {
    return new Date(now.getFullYear(), now.getMonth() + 1, 3);
  }
  return null;
}

function OptionCard({ freq, selected, onSelect, radioRef }) {
  return (
    <div
      ref={radioRef}
      role="radio"
      aria-checked={selected}
      tabIndex={selected ? 0 : -1}
      className={'option-card' + (selected ? ' is-selected' : '')}
      onClick={() => onSelect(freq.key)}
    >
      <span className="radio-hit">
        <span className={'radio-visual' + (selected ? ' is-selected' : '')} aria-hidden="true" />
      </span>
      <div className="option-body">
        <div className="option-label-row">
          <span className="option-label p2">{freq.sheetLabel}</span>
          {freq.badge && (
            <span className={'badge p3-strong' + (selected ? ' badge--success' : ' badge--neutral')}>{freq.badge}</span>
          )}
        </div>
        <p className="option-desc p3">{freq.description}</p>
      </div>
    </div>
  );
}

function getFocusable(container) {
  if (!container) return [];
  return Array.from(container.querySelectorAll('button, [role="radio"]')).filter(
    (el) => el.tabIndex !== -1
  );
}

function RecurringSheet({ draftFrequency, onSelect, onApply, onDismiss, closing }) {
  const sheetRef = useRef(null);
  const closeBtnRef = useRef(null);
  const radioRefs = useRef({});

  useEffect(() => {
    closeBtnRef.current && closeBtnRef.current.focus();

    function handleKeyDown(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        onDismiss();
        return;
      }
      if (e.key === 'Tab') {
        const focusables = getFocusable(sheetRef.current);
        if (focusables.length === 0) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    }
    document.addEventListener('keydown', handleKeyDown);
    return () => document.removeEventListener('keydown', handleKeyDown);
    // eslint-disable-next-line
  }, []);

  const handleRadioKeyDown = useCallback((e) => {
    const idx = ORDER.indexOf(draftFrequency);
    let nextIdx = null;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') nextIdx = (idx + 1) % ORDER.length;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') nextIdx = (idx - 1 + ORDER.length) % ORDER.length;
    if (nextIdx !== null) {
      e.preventDefault();
      const nextKey = ORDER[nextIdx];
      onSelect(nextKey);
      const nextEl = radioRefs.current[nextKey];
      nextEl && nextEl.focus();
    }
  }, [draftFrequency, onSelect]);

  const draft = FREQUENCIES[draftFrequency];

  return (
    <div className={'scrim' + (closing ? ' is-closing' : '')} onClick={onDismiss}>
      <div
        className={'sheet' + (closing ? ' is-closing' : '')}
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheet-title"
        ref={sheetRef}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="sheet-content">
          <div className="sheet-title-row">
            <div className="sheet-title-col">
              <h2 id="sheet-title" className="h2">Set up recurring buy</h2>
            </div>
            <div className="sheet-close-col">
              <button className="icon-btn" aria-label="Close" ref={closeBtnRef} onClick={onDismiss}>
                <img src={imgCloseX} alt="" style={{ width: 12.485, height: 12.485 }} />
              </button>
            </div>
          </div>

          <p className="sheet-body p1">
            Buy {ASSET_NAME} automatically on a schedule and{' '}
            <span className="discount-accent">get 30% off </span>
            from your 2nd transaction onwards. Cancel anytime.
          </p>

          <div className="selection-block">
            <h3 className="selection-title h3">How often?</h3>
            <div role="radiogroup" aria-label="Purchase frequency" onKeyDown={handleRadioKeyDown} className="radiogroup">
              {ORDER.map((key) => (
                <OptionCard
                  key={key}
                  freq={FREQUENCIES[key]}
                  selected={draftFrequency === key}
                  onSelect={onSelect}
                  radioRef={(el) => { radioRefs.current[key] = el; }}
                />
              ))}
            </div>
          </div>

          <span aria-live="polite" className="sr-only">{`Selected: ${draft.sheetLabel}`}</span>
        </div>

        <div className="buttons-row">
          <button className="cta-btn p1-strong" onClick={onApply}>{draft.ctaLabel}</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [appliedFrequency, setAppliedFrequency] = useState('once');
  const [draftFrequency, setDraftFrequency] = useState('once');
  const [sheetOpen, setSheetOpen] = useState(false);
  const [closing, setClosing] = useState(false);
  const chipRef = useRef(null);

  const applied = FREQUENCIES[appliedFrequency];
  const recurring = applied.discounted;

  const openSheet = () => {
    setDraftFrequency(appliedFrequency);
    setSheetOpen(true);
  };

  const dismissSheet = useCallback(() => {
    setClosing(true);
    setTimeout(() => {
      setSheetOpen(false);
      setClosing(false);
      chipRef.current && chipRef.current.focus();
    }, 150);
  }, []);

  const applySheet = useCallback(() => {
    setAppliedFrequency(draftFrequency);
    dismissSheet();
    // eslint-disable-next-line
  }, [draftFrequency, dismissSheet]);

  const nextChargeDate = recurring ? getNextChargeDate(appliedFrequency) : null;

  return (
    <div className="frame">
      <div className="body">
        <div className="navbar">
          <button className="icon-btn icon-btn--back" aria-label="Go back">
            <img src={imgNavBack} alt="" style={{ width: 18, height: 13 }} />
          </button>
          <img className="navbar-logo" src={imgTopperLogo} alt="Topper by Uphold" style={{ width: 162 }} />
          <button className="icon-btn icon-btn--menu" aria-label="Open menu">
            <img src={imgNavMenu} alt="" style={{ width: 20, height: 16 }} />
          </button>
        </div>

        <div className="main-container">
          <div className="screen-title-row">
            <h3 className="screen-title h3">Review your order</h3>
          </div>

          <div className="asset-block">
            <div className="cards-asset-amount">
              <div className="asset-icon-wrap">
                <img src={imgBtc56} alt="" />
                {recurring && (
                  <React.Fragment>
                    <img className="recurring-badge-ring" src={imgRepeatBadgeRing} alt="" style={{ width: 24, height: 24 }} />
                    <span className="recurring-badge">
                      <img src={imgRepeatIcon} alt="" style={{ width: 11.75, height: 11.75 }} />
                    </span>
                  </React.Fragment>
                )}
              </div>
              <div className="asset-amount-content">
                <p className="you-get-label p2">You get</p>
                <p className="you-get-amount h1">0.00113838 BTC</p>
              </div>
            </div>

            <button
              className="frequency-chip"
              ref={chipRef}
              onClick={openSheet}
              aria-haspopup="dialog"
              aria-expanded={sheetOpen}
              aria-label={`Change purchase frequency, currently ${applied.chipLabel}`}
            >
              <span className="frequency-chip-content">
                <span className="frequency-chip-icon">
                  <img src={recurring ? imgFrequencyIconActive : imgFrequencyIcon} alt="" />
                </span>
                <span className="frequency-chip-label p2">{applied.chipLabel}</span>
              </span>
              <span className="frequency-chip-chevron">
                <img src={imgChevronDown} alt="" />
              </span>
            </button>
          </div>

          <div className="details">
            <div className="card">
              <div className="account-row">
                <span className="icon-container">
                  <img src={imgMastercardSymbol} alt="" style={{ width: 24, height: 14.83 }} />
                </span>
                <div className="account-main">
                  <div className="account-name-row">
                    <span className="default-text p2">Pay with</span>
                    <span className="emphasis-text p2-strong">#8976</span>
                  </div>
                  <div className="account-market-row">
                    <span className="subdued-text p2">Card</span>
                    <span className="bullet-dot" aria-hidden="true" />
                    <span className="subdued-text p2">USD</span>
                  </div>
                </div>
                <button className="ghost-btn p2-strong">Edit</button>
              </div>
            </div>

            <div className="card">
              <div className="account-row">
                <span className="icon-container">
                  <img src={imgBtc24} alt="" style={{ width: 24, height: 24 }} />
                </span>
                <div className="account-main">
                  <div className="account-name-row">
                    <span className="default-text p2">Send to</span>
                    <span className="emphasis-text p2-strong">BTC wallet address</span>
                    <img src={imgCircleInfo} alt="" style={{ width: 14.83, height: 14.83 }} />
                  </div>
                  <div className="account-market-row">
                    <span className="account-mono mono">bc1qx***493p4</span>
                  </div>
                </div>
                <button className="ghost-btn p2-strong">Edit</button>
              </div>
            </div>

            <div className="card breakdown-card">
              <div className="breakdown-row">
                <span className="breakdown-label p2">You pay</span>
                <span className="breakdown-value p2">$100.00</span>
              </div>
              <div className="breakdown-row">
                <div className="total-fees-group">
                  <span className="breakdown-label p2" style={{ flex: 'none' }}>Total fees</span>
                  <button className="see-details-btn p2">See details</button>
                </div>
                <span className="breakdown-value p2">- $4.00</span>
              </div>
              <div className="breakdown-row">
                <span className="breakdown-label p2">Amount used to buy BTC</span>
                <span className="breakdown-value p2">$96.00</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="footer-actions">
        <div className="footer-gradient" />
        <div className="footer-content">
          {recurring && (
            <div className="frequency-note">
              <p className="frequency-note-line p3">
                <span className="default-text">{`First charge today · next on ${formatChargeDate(nextChargeDate)}`}</span>
                <span className="discount-note">(30% off)</span>
              </p>
              <p className="legal-line caption">
                By placing this order, you authorise recurring charges until you cancel.
              </p>
            </div>
          )}
          <div className="buttons-row">
            <button className="cta-btn p1-strong">{recurring ? applied.ctaLabel : 'Pay now'}</button>
          </div>
        </div>
      </div>

      {sheetOpen && (
        <RecurringSheet
          draftFrequency={draftFrequency}
          onSelect={setDraftFrequency}
          onApply={applySheet}
          onDismiss={dismissSheet}
          closing={closing}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="stage">
    <div className="stage-label">Topper · Review your order — recurring buy</div>
    <App />
  </div>
);
</script>
</body>
</html>
